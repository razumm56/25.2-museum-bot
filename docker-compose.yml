services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai_museum_app
    env_file:
      - .env
    volumes:
      - ./temp:/app/temp
      - ./data:/app/data
    depends_on:
      - postgres
    networks:
      - ai_museum_net
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4
    container_name: postgres_admin_panel
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - "5050:80"
    depends_on:
      - postgres
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - ai_museum_net
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg18-trixie
    container_name: postgres_container
    environment:
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      POSTGRES_USER: ${PG_USER}
      POSTGRES_DB: ${PG_DB}
      # держу в курсе: с 18 версии дефолтное место изменилось
      # PGDATA: /var/lib/postgresql/18/docker <- новый дефолт
    volumes:
      - postgre:/var/lib/postgresql
    ports:
      - "5432:5432"
    networks:
      - ai_museum_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER} -d ${PG_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgre:
  pgadmin_data:

networks:
  ai_museum_net:
    driver: bridge
