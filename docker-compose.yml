services:
  pgadmin:
    image: dpage/pgadmin4
    container_name: postgres_admin_panel
    environment:
      PGADMIN_DEFAULT_EMAIL: user@domain.com
      PGADMIN_DEFAULT_PASSWORD: 12345678
    ports:
      - "5050:80"
    networks:
      - ai_museum_net

  postgres:
    image: pgvector/pgvector:pg18-trixie
    container_name: postgres_container  
    environment:
      POSTGRES_PASSWORD: 12345678
      POSTGRES_USER: AiMuseumDB
      PGDATA: /var/lib/postgresql/data/AiMuseum
    volumes:
      - postgre:/var/lib/postgresql
    ports:
      - "5433:5432"
    networks:
      - ai_museum_net

volumes:
  postgre:

networks:
  ai_museum_net:
    driver: bridge
