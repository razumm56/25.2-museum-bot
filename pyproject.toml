[project]
name = "ai-museum"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.22.0",
    "assemblyai>=0.46.0",
    "dotenv>=0.9.9",
    "langchain-community>=0.4.1",
    "langchain-gigachat>=0.3.13a1",
    "loguru>=0.7.3",
    "matplotlib",
    "opencv-python>=4.12.0.88",
    "pandas>=2.3.3",
    "pgvector>=0.4.1",
    "psycopg-binary>=3.2.13",
    "ruaccent>=1.5.8.3",
    "scipy>=1.16.3",
    "silero>=0.5.1",
    "soundfile>=0.13.1",
    "sqlalchemy>=2.0.44",
    "torch>=2.9.1",
    "uvicorn>=0.38.0",
]

[tool.pyright]
reportUnknownMemberType = false
reportAny = false

[tool.uv]
default-groups = ["langchain"]

[dependency-groups]
langchain = [
    "langchain>=1.0.3",
    "langchain-gigachat==0.3.13a1",
    "langchain-openai>=1.0.1",
    "langgraph-checkpoint-postgres>=3.0.1",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu" }
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

