[project]
name = "ai-museum"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.22.0",
    "dotenv>=0.9.9",
    "loguru>=0.7.3",
    "pandas>=2.3.3",
    "uvicorn>=0.38.0",
]

[tool.uv]
default-groups = ["langchain"]

[dependency-groups]
langchain = [
    "langchain>=1.0.3",
    "langchain-gigachat==0.3.13a1",
    "langchain-openai>=1.0.1",
    "langgraph-checkpoint-sqlite>=3.0.0",
]

